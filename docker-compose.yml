services:
  api:
    build: ./backend
    env_file: .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports: ["8000:8000"]
    depends_on: [postgres, redis, neo4j, opensearch]
    volumes: ["./backend:/app", "./sample-data:/app/sample-data:ro"]
  worker:
    build: ./backend
    env_file: .env
    command: celery -A app.queue.celery_app.celery_app worker -Q investigations --loglevel=INFO
    depends_on: [redis, postgres, neo4j, opensearch]
    volumes: ["./backend:/app", "./sample-data:/app/sample-data:ro"]
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes: ["./frontend:/app", "/app/node_modules"]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: osint
      POSTGRES_PASSWORD: osint
      POSTGRES_DB: osint
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data", "./database/postgres/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/osint-password
    ports: ["7474:7474", "7687:7687"]
    volumes: ["neo4jdata:/data"]
  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]
volumes:
  pgdata:
  neo4jdata:
  ollama:
