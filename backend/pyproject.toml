[project]
name = "autonomous-osint-backend"
version = "0.1.0"
description = "Recursive, graph-based OSINT investigation backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.0",
  "SQLAlchemy>=2.0.0",
  "asyncpg>=0.29.0",
  "redis>=5.0.0",
  "celery>=5.4.0",
  "neo4j>=5.20.0",
  "opensearch-py>=2.6.0",
  "httpx>=0.27.0",
  "phonenumbers>=8.13.0",
  "python-whois>=0.9.0",
  "dnspython>=2.6.0",
  "playwright>=1.44.0",
  "reportlab>=4.2.0"
]

[project.optional-dependencies]
test = ["pytest>=8.2.0", "pytest-asyncio>=0.23.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
