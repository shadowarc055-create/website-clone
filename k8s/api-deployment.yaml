apiVersion: apps/v1
kind: Deployment
metadata:
  name: osint-api
spec:
  replicas: 2
  selector:
    matchLabels: { app: osint-api }
  template:
    metadata:
      labels: { app: osint-api }
    spec:
      containers:
        - name: api
          image: osint-api:latest
          ports: [{ containerPort: 8000 }]
          envFrom: [{ secretRef: { name: osint-secrets } }]
---
apiVersion: v1
kind: Service
metadata:
  name: osint-api
spec:
  selector: { app: osint-api }
  ports: [{ port: 8000, targetPort: 8000 }]
